# Keeps the pinned action SHAs current. One grouped pull request a week.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # main is the default branch, but changes land on develop first.
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
