# Keeps the pinned action SHAs current. One grouped pull request a week.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # develop is the default branch; set here so updates never go straight to main.
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
