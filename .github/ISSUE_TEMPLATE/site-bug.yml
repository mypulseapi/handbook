name: Website problem
description: The handbook site itself is broken (layout, navigation, search, links).
title: "[Site]: "
labels: ["site-bug", "needs-triage"]
body:
  - type: input
    id: url
    attributes:
      label: URL
      placeholder: https://mypulseapi.github.io/handbook/...
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on macOS, Safari on iPhone 15
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here if they help.
    validations:
      required: false
