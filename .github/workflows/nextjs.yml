# Build the PULSE developer handbook and deploy it to GitHub Pages.
#
# Adapted from GitHub's Next.js starter. The starter detected only yarn and npm, and fell back to
# `npm ci` whenever it saw a package.json. This repo uses pnpm, so that fallback would have run
# `npm ci` against a tree with no package-lock.json and failed on the first push.
#
# pnpm is installed before `setup-node`, deliberately: `cache: pnpm` resolves the store path by
# running pnpm, so the binary has to exist already.
name: Deploy Next.js site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          # Injects basePath and assetPrefix to match wherever Pages serves this from, and
          # disables server-side image optimization, which a static export cannot do.
          static_site_generator: next

      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            .next/cache
          # Rebuild the cache when the lockfile or any source or content file changes.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx', '**.mdx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
