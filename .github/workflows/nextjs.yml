# Build the PULSE developer handbook and deploy it to GitHub Pages.
#
# Adapted from GitHub's Next.js starter. The starter detected only yarn and npm, and fell back to
# `npm ci` whenever it saw a package.json. This repo uses pnpm, so that fallback would have run
# `npm ci` against a tree with no package-lock.json and failed on the first push.
#
# pnpm is installed before `setup-node`, deliberately: `cache: pnpm` resolves the store path by
# running pnpm, so the binary has to exist already.
#
# Release flow. The release pull request (develop -> main) builds the site. If the build and every
# other required check pass, this workflow merges the pull request and starts the deploy. If
# anything fails, it comments on the pull request and stops there; nothing is merged or deployed.
# A merge made with GITHUB_TOKEN does not trigger the push event, which is why the deploy is
# started with workflow_dispatch instead. A maintainer merging by hand deploys through the push.
name: Deploy Next.js site to Pages

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

# Read-only by default; each job asks for what it needs.
permissions:
  contents: read

# One deployment at a time and never cancelled midway. A new push to a pull request cancels its
# older build.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          # Rebuild the cache when the lockfile or any source or content file changes.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx', '**.mdx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # next.config.mjs already sets `output: 'export'`, and the site is served from the root of
      # a custom domain, so it needs no basePath. actions/configure-pages with
      # `static_site_generator: next` is not used: it fails to rewrite a config wrapped in
      # withMDX() ("TypeError: error must be an instance of Error").
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # Release pull request only: wait for the other required checks, merge, start the deploy.
  release:
    name: Merge release
    needs: build
    if: >-
      github.event_name == 'pull_request'
      && github.head_ref == 'develop'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Wait for the required checks
        run: gh pr checks "$PR" --required --watch --fail-fast --interval 15

      - name: Merge
        run: gh pr merge "$PR" --merge

      - name: Start the deploy
        run: gh workflow run nextjs.yml --ref main

  report:
    name: Report failure
    needs: [build, release]
    if: >-
      failure()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Comment on the pull request
        run: |
          gh pr comment "$PR" --body "Release stopped: the site build or a required check failed, so this pull request was not merged and nothing was deployed. Details: $RUN_URL"

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
