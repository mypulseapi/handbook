name: Checks

# Runs on every pull request (including from forks, read-only token) and on main.
# These two jobs are the required status checks on main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

  links:
    name: Link check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Links inside the repository only, so a pull request never fails because some
          # other site is down. External links are checked weekly by link-report.yml.
          # The PR template's relative link only resolves when GitHub renders it.
          args: >-
            --no-progress --offline --include-fragments
            --exclude-path .github/pull_request_template.md
            "**/*.md"
          fail: true
