name: Checks

# Runs on every pull request (including from forks, read-only token) and on develop and main.
# Markdown lint and Link check are required on develop and main; Source branch on main.
on:
  # edited: changing the base branch must re-run Source branch.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [develop, main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on develop and main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    name: Source branch
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Only develop may be merged into main
        if: github.base_ref == 'main' && (github.head_ref != 'develop' || github.event.pull_request.head.repo.full_name != github.repository)
        run: |
          echo "::error::Pull requests into main must come from develop. Open this one against develop instead."
          exit 1

  markdown:
    name: Markdown lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

  search-index:
    name: Search index
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # No model and no install: the verifier re-chunks the MDX and compares hashes, which is
      # text processing. It catches the failure that is otherwise silent, which is a page edited
      # without rebuilding the index, leaving the assistant answering from the old wording.
      - name: Verify the committed search index matches the content
        run: node --experimental-strip-types scripts/verify-search-index.mjs

  links:
    name: Link check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Links inside the repository only, so a pull request never fails because some
          # other site is down. External links are checked weekly by link-report.yml.
          # The PR template's relative link only resolves when GitHub renders it.
          args: >-
            --no-progress --offline --include-fragments
            --exclude-path .github/pull_request_template.md
            "**/*.md"
          fail: true
